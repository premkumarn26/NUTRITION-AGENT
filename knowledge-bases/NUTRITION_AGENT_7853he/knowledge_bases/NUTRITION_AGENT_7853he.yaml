description: This PDF serves as a foundational knowledge base and operational guide
  for building an AI Nutrition Agent utilizing IBM watsonx Orchestrate and IBM Granite
  models. It details the core capabilities of the assistant, such as processing multimodal
  inputs to deliver hyper-personalized, dynamic meal plans based on individual health
  goals, cultural preferences, and medical needs. Furthermore, the document establishes
  strict system instructions and guardrails, ensuring the agent provides practical,
  evidence-based dietary advice while explicitly refusing to answer out-of-domain
  queries like programming or finance.
